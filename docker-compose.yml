services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-doorsheet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-doorsheet}
      POSTGRES_DB: ${POSTGRES_DB:-doorsheet}
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    volumes:
      - door_sheet_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doorsheet -d doorsheet"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  door_sheet_db:
